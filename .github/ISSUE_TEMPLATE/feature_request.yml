name: Feature request
description: Suggest a capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you unable to do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
    validations:
      required: true
  - type: checkboxes
    id: spec
    attributes:
      label: Design check
      options:
        - label: I have read the design spec and this is not already covered or explicitly ruled out

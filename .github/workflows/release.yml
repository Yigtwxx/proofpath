name: Release

# Publishes to PyPI via Trusted Publishing (OIDC), then creates the GitHub Release
# for the tag with the CHANGELOG section as its notes and the wheel and sdist
# attached. No API token is stored anywhere in this repository or its secrets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # A tag whose version has no CHANGELOG section stops here, before PyPI: a
      # release is not re-publishable, its notes must exist first.
      - name: The CHANGELOG has this version's section
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > /dev/null
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      # Idempotent: a re-run of the workflow for a tag that is already released
      # (a retried publish, a manual dispatch) leaves the existing release alone.
      - run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md dist/*
        env:
          GH_TOKEN: ${{ github.token }}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofpath"
dynamic = ["version"]
description = "Check whether the sources behind a claim actually say what the claim says."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Yigit Erdogan" }]
keywords = [
    "fact-checking", "citation", "rag", "retrieval-augmented-generation",
    "nli", "entailment", "research-integrity", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

# Base install stays small on purpose: no torch, no browser engine.
dependencies = [
    "typer>=0.15",
    "textual>=1.0",
    # Already pulled in by textual; declared because ui.py imports it directly.
    "rich>=13",
    "httpx>=0.28",
    "curl_cffi>=0.16.1",
    "scrapling>=0.4.15",
    "protego>=0.3",  # parses robots.txt for fetch-ladder steps 1-2
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "fastembed>=0.5",
    # Pulled in by fastembed already; declared because entailment.py and
    # retrieval.py import them directly.
    "onnxruntime>=1.20",
    "huggingface_hub>=0.30",
    "tokenizers>=0.20",
    "numpy>=1.26",
    "platformdirs>=4.3",
    "orjson>=3.11",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Browser engine for fetch-ladder step 3. Installed on demand with explicit
# consent; see spec section 7.1.
browser = ["scrapling[fetchers]>=0.4.15"]
# GPU-accelerated embeddings and NLI. Device order stays CUDA -> MPS -> CPU.
gpu = ["torch>=2.5", "sentence-transformers>=3.3"]
dev = [
    "ruff>=0.9",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "respx>=0.22",
]

[project.scripts]
proofpath = "proofpath.cli:app"

[project.urls]
Homepage = "https://github.com/Yigtwxx/proofpath"
Repository = "https://github.com/Yigtwxx/proofpath"
Issues = "https://github.com/Yigtwxx/proofpath/issues"
Changelog = "https://github.com/Yigtwxx/proofpath/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/proofpath/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proofpath"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PTH", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # Third-party noise from the fetch ladder's parsers, not ours to fix:
    # scrapling passes lxml a no-op option; pymupdf's SWIG layer trips a CPython check.
    "ignore:The 'strip_cdata' option of HTMLParser:DeprecationWarning",
    "ignore:builtin type (SwigPy\\w+|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

[tool.mypy]
# No python_version pin: numpy's stubs use the 3.12 `type` statement, and the
# 3.10 floor is enforced by ruff's target-version and the CI matrix instead.
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Ship no stubs or no py.typed marker.
module = ["onnxruntime.*", "torch", "torch.*", "fastembed.*", "tokenizers.*"]
ignore_missing_imports = true
